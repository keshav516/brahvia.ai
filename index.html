  <style>
/* Layout: collapsible sidebar + workspace; builder is chat | files | preview-or-code; mobile uses a drawer and a Chat/Preview/Code switch */
:root{
  --font-display:'Outfit',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --bg:#ffffff; --bg-soft:#F4F6FC; --surface:#ffffff; --surface-2:#EBF0FB;
  --fg:#0A1A4F; --fg-2:#46537F; --fg-3:#66739C;
  --line:#D8DFEE; --line-2:#C3CDE5;
  --primary:#2347D8; --primary-h:#1B3BB9; --on-primary:#ffffff; --primary-soft:#E7EDFF; --on-soft:#1B3BB9;
  --gold:#C28F1F; --gold-soft:#FBF2D9;
  --ok:#16794C; --ok-soft:#E1F4EA; --warn:#8A5A00; --warn-soft:#FFF3D1; --bad:#B42318; --bad-soft:#FDE7E4;
  --shadow:0 1px 2px rgba(10,26,79,.06),0 10px 28px rgba(10,26,79,.07);
  --tile:#080543; --tpad:.17; --wm-pick:var(--img-wm-d);
  --r:16px; --sbw:268px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0827; --bg-soft:#100C33; --surface:#16114A; --surface-2:#1E1866;
    --fg:#E4DFFF; --fg-2:#BAB1EC; --fg-3:#9288D0;
    --line:#2C2680; --line-2:#3C349C;
    --primary:#7355F7; --primary-h:#8468FF; --on-primary:#ffffff; --primary-soft:#2A2278; --on-soft:#DAD1FF;
    --gold:#E6BC55; --gold-soft:#2F2752;
    --ok:#52D6A0; --ok-soft:#12332F; --warn:#F2C65A; --warn-soft:#3A2F1A; --bad:#FF8F85; --bad-soft:#41181F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --tile:transparent; --tpad:0; --wm-pick:var(--img-wm-l);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0827; --bg-soft:#100C33; --surface:#16114A; --surface-2:#1E1866;
  --fg:#E4DFFF; --fg-2:#BAB1EC; --fg-3:#9288D0;
  --line:#2C2680; --line-2:#3C349C;
  --primary:#7355F7; --primary-h:#8468FF; --on-primary:#ffffff; --primary-soft:#2A2278; --on-soft:#DAD1FF;
  --gold:#E6BC55; --gold-soft:#2F2752;
  --ok:#52D6A0; --ok-soft:#12332F; --warn:#F2C65A; --warn-soft:#3A2F1A; --bad:#FF8F85; --bad-soft:#41181F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --tile:transparent; --tpad:0; --wm-pick:var(--img-wm-l);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
#root{height:100%}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{flex:none;display:block}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}

/* ---------- logo system (artwork cut from the supplied logo image) ---------- */
.logo{--s:34px;display:inline-flex;align-items:center;gap:calc(var(--s)*.34);color:var(--fg)}
.lg-tile{display:grid;place-items:center;flex:none;background:var(--tile);border-radius:calc(var(--s)*.3);padding:calc(var(--s)*var(--tpad));box-sizing:content-box}
.lg-m{display:block;flex:none;height:var(--s);aspect-ratio:320/384;background:var(--img-sym) center/contain no-repeat}
.lg-w{display:block;flex:none;height:calc(var(--s)*.46);aspect-ratio:560/113;background:var(--wm-pick) center/contain no-repeat}
.lg-m.mono{background:currentColor;-webkit-mask:var(--img-sym-mask) center/contain no-repeat;mask:var(--img-sym-mask) center/contain no-repeat}
.lg-w.mono{background:currentColor;-webkit-mask:var(--img-wm-mask) center/contain no-repeat;mask:var(--img-wm-mask) center/contain no-repeat}
.logo-v,.logo-tag{flex-direction:column;gap:calc(var(--s)*.2)}
.logo-v .lg-w,.logo-tag .lg-w{height:calc(var(--s)*.3)}
.logo-tag .tl{font-size:max(11px,calc(var(--s)*.1));letter-spacing:.22em;text-transform:uppercase;color:var(--fg-2);font-weight:500;font-family:var(--font-display)}
.logo.lg-dark{--tile:transparent;--tpad:0;--wm-pick:var(--img-wm-l);color:#fff}
.logo.lg-dark .tl{color:#BDB3F0}
.logo.lg-light{--tile:#080543;--tpad:.17;--wm-pick:var(--img-wm-d);color:#0A1A4F}
.logo.lg-light .tl{color:#46537F}
.logo-mono{gap:calc(var(--s)*.3)}
.appicon{--s:44px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.26);background:linear-gradient(160deg,#0C0848,#050330);box-shadow:inset 0 0 0 1px rgba(150,130,255,.25);flex:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--primary);color:var(--on-primary)} .btn-p:hover{background:var(--primary-h)}
.btn-s{background:var(--surface);border-color:var(--line-2);color:var(--fg)} .btn-s:hover{background:var(--surface-2)}
.btn-g{background:none;color:var(--fg-2)} .btn-g:hover{background:var(--surface-2);color:var(--fg)}
.btn-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:none;color:var(--fg-2);cursor:pointer}
.ibtn:hover{background:var(--surface-2);color:var(--fg)}
.in{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:16px}
.in:focus{border-color:var(--primary);outline:2px solid var(--primary-soft)}
textarea.in{resize:vertical;min-height:90px;line-height:1.5}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}
.err{color:var(--bad);font-size:13px;font-weight:500;min-height:1em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--primary-soft);color:var(--on-soft)}
.p-gold{background:var(--gold-soft);color:var(--gold)} .p-mute{background:var(--surface-2);color:var(--fg-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--fg-2);font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(10,26,79,.14)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.45}
.n-ok{background:var(--ok-soft);color:var(--ok)} .notice a{color:inherit;text-decoration:underline;word-break:break-all} .n-warn{background:var(--warn-soft);color:var(--warn)} .n-bad{background:var(--bad-soft);color:var(--bad)} .n-info{background:var(--primary-soft);color:var(--on-soft)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .3s}
.bar.low>i{background:var(--warn)} .bar.zero>i{background:var(--bad)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);height:100%}
.sb{display:flex;flex-direction:column;gap:4px;padding:14px 12px;border-right:1px solid var(--line);background:var(--bg-soft);min-height:0;overflow-y:auto}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 12px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:12px;color:var(--fg-2);font-weight:500;cursor:pointer;text-align:left}
.nav-i:hover{background:var(--surface-2);color:var(--fg)}
.nav-i[aria-current=page]{background:var(--primary-soft);color:var(--on-soft);font-weight:600}
.nav-new{background:var(--primary);color:var(--on-primary);font-weight:600;margin-bottom:8px}
.nav-new:hover{background:var(--primary-h);color:var(--on-primary)}
.sb-sp{flex:1}
.sb-credit{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;margin-top:8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px max(16px,2.5vw);border-bottom:1px solid var(--line);background:var(--bg)}
.top h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpill{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cpill svg{color:var(--gold)} .cpill.low{border-color:var(--warn);color:var(--warn)} .cpill.zero{border-color:var(--bad);color:var(--bad)}
.avatar{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:700;font-family:var(--font-display);border:0;cursor:pointer}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:46px;min-width:210px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);z-index:20}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.banner{padding:10px max(16px,2.5vw) 0}
.content{flex:1;min-height:0;overflow:auto;padding:28px max(16px,3.5vw) 56px}
.content-flush{padding:0;overflow:hidden}
.page{max-width:980px;margin:0 auto;display:grid;gap:24px}
.page h1{font-size:clamp(26px,4vw,34px)}
.scrim{display:none}
@media (min-width:900px){
  .app.is-collapsed{--sbw:76px}
  .is-collapsed .lbl,.is-collapsed .sb-hide{display:none}
  .is-collapsed .nav-i{justify-content:center;padding:0}
  .is-collapsed .sb-top{flex-direction:column;padding-bottom:12px}
  .only-m{display:none!important}
}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:40;transform:translateX(-104%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .drawer-open .sb{transform:none}
  .drawer-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,4,30,.55);z-index:30}
  .only-d{display:none!important}
}

/* ---------- home + composer ---------- */
.hero{display:grid;gap:10px;padding-top:4px}
.hero .tag{font-family:var(--font-display);color:var(--fg-2);letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:500}
.hero h1{font-size:clamp(30px,5.4vw,46px)}
.composer{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px}
.composer textarea{width:100%;border:0;background:none;resize:none;min-height:104px;font-size:16px;line-height:1.55;padding:6px 6px}
.composer textarea:focus{outline:none}
.cmp-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.cmp-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.send{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;border:0;background:var(--primary);color:var(--on-primary);cursor:pointer}
.send:hover{background:var(--primary-h)} .send[disabled]{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:14px;color:var(--fg-2)}
.chip:hover{border-color:var(--primary);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{display:grid;gap:12px;align-content:start}
.pcard .sw{height:70px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:600;font-size:20px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.li{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--on-soft);flex:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:20px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.msgs{flex:1;overflow:auto;padding:24px max(16px,3.5vw)}
.msgs-in{max-width:780px;margin:0 auto;display:grid;gap:20px}
.msg{display:flex;gap:12px;min-width:0}
.msg.u{justify-content:flex-end}
.bub{max-width:min(100%,640px);padding:12px 16px;border-radius:18px;min-width:0;overflow-wrap:anywhere}
.u .bub{background:var(--primary-soft);color:var(--fg);border-bottom-right-radius:6px}
.a .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#080543;flex:none}
.av .lg-m{--s:21px}
.code{margin-top:10px;border-radius:12px;border:1px solid var(--line-2);overflow:hidden}
.code header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;background:var(--surface-2);font-size:12px;color:var(--fg-2);font-family:var(--font-mono)}
.code pre{margin:0;padding:12px;overflow-x:auto;font:13px/1.6 var(--font-mono);background:var(--bg-soft)}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--fg-3);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
.dock{padding:12px max(16px,3.5vw) 16px;border-top:1px solid var(--line);background:var(--bg)}
.dock .composer{max-width:780px;margin:0 auto}
.dock textarea{min-height:56px}
.empty{display:grid;gap:14px;justify-items:start;max-width:560px;margin:8vh auto 0;padding:0 4px}

/* ---------- builder ---------- */
.bld{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);height:100%;min-height:0}
.bld-seg{display:none}
.bl{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--bg)}
.bl-msgs{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.bl .bub{max-width:100%;font-size:14px}
.bl-in{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.bl-in textarea{min-height:68px;font-size:16px}
.files{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:2px;background:var(--bg-soft)}
.files h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);padding:4px 8px;font-family:var(--font-body);font-weight:600}
.fbtn{display:flex;align-items:center;gap:10px;min-height:38px;width:100%;padding:0 8px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--fg-2);font:13px var(--font-mono);text-align:left}
.fbtn:hover{background:var(--surface-2)} .fbtn[aria-current=true]{background:var(--primary-soft);color:var(--on-soft)}
.fbtn small{margin-left:auto;color:var(--fg-3);font-family:var(--font-body)}
.br{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar-t{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar-t select{min-height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;max-width:190px}
.stage{flex:1;min-height:0;overflow:auto;background:var(--bg-soft);padding:16px}
.frame{margin:0 auto;background:#fff;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-height:100%;max-width:100%;color-scheme:light}
.frame.ph{width:390px}
.frame.dk{width:100%}
.codebox{display:flex;flex-direction:column;height:100%;gap:10px}
.codebox textarea{flex:1;min-height:340px;width:100%;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:14px;font:13px/1.6 var(--font-mono);resize:none;white-space:pre;overflow:auto;tab-size:2}
.fchips{display:none;gap:6px;flex-wrap:wrap}
.empty-prev{display:grid;place-items:center;height:100%;min-height:300px;text-align:center;color:var(--fg-3);gap:12px;padding:20px}
@media (max-width:899px){
  .bld{display:block;overflow:auto;height:100%}
  .bld-seg{display:flex;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
  .bld-seg .seg{width:100%} .bld-seg .seg button{flex:1;justify-content:center}
  .bld[data-tab=chat] .br{display:none}
  .bld:not([data-tab=chat]) .bl{display:none}
  .bl{border-right:0;min-height:calc(100% - 64px)}
  .br{min-height:calc(100% - 64px)}
  .bld .files{display:none}
  .fchips{display:flex}
  .frame.ph{width:100%}
}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);height:100%;overflow:auto}
.ab{display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:48px;background:radial-gradient(120% 90% at 20% 0%,#2B1F8F 0%,#120B45 55%,#090625 100%);color:#E8E3FF}

.ab h2{font-size:30px;color:#fff;max-width:14ch}
.ab ul{list-style:none;margin:0;padding:0;display:grid;gap:14px;color:#CFC7F7}
.ab li{display:flex;gap:12px;align-items:flex-start}
.ab li svg{color:#E6BC55;margin-top:3px}
.ab small{color:#A99FE0}
.ac{display:grid;align-content:center;justify-items:center;padding:32px 20px;gap:16px}
.ac-in{width:100%;max-width:420px;display:grid;gap:18px}
.ac-logo{display:none}
.divider{display:flex;align-items:center;gap:12px;color:var(--fg-3);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn .g{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);font-weight:700;font-size:12px}
.form{display:grid;gap:14px}
@media (max-width:899px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .ab{display:none}
  .ac-logo{display:block;padding-bottom:6px}
  .ac{align-content:start;padding-top:calc(36px + env(safe-area-inset-top,0px))}
}

/* ---------- settings / misc ---------- */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.bt{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:grid}
.bt .stg{display:grid;place-items:center;min-height:130px;padding:18px}
.bt .stg.dark{background:#0C0830;color:#fff}
.bt .stg.light{background:#fff;color:#0A1A4F}
.bt .cap{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:2px}
.bt .cap b{font-size:14px} .bt .cap span{font-size:12.5px;color:var(--fg-2)}
.tick{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.tick svg{margin-top:3px;flex:none}
.cost-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.big{font-family:var(--font-display);font-size:clamp(40px,8vw,60px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(5,4,30,.6);display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:88%;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow)}
.modal textarea{font:12.5px/1.5 var(--font-mono);min-height:130px;width:100%;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-soft);padding:10px;resize:vertical;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* preview iframe (sandboxed, no network) */
.frame iframe{display:block;width:100%;height:100%;min-height:560px;border:0;background:#fff}
.stage .frame{min-height:560px}
noscript{display:block;padding:24px;font-family:system-ui,sans-serif}

[hidden]{display:none!important}

/* ---------- compact phone sizing ---------- */
@media (max-width:520px){
  body{font-size:14px}
  .seg button{padding:0 11px;gap:5px}
  .ac{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 24px}
  .ac-in{gap:14px}
  .ac-in h1{font-size:clamp(26px,7.4vw,30px)!important}
  .ac-logo .logo{--s:36px!important}
  .ac-in .btn{min-height:50px;font-size:16px}
  .ac{padding-top:calc(40px + env(safe-area-inset-top,0px))}
  .top{gap:6px;min-height:50px;padding:6px 10px}
  .top > span.only-m{display:none}
  .top h2{font-size:16px}
  .top .ibtn{width:36px;height:36px;min-height:36px}
  .cpill{min-height:32px;padding:0 10px;gap:5px;font-size:13px}
  .avatar{width:32px;height:32px;font-size:14px}
  .content{padding:16px 12px 40px}
  .composer{padding:10px;border-radius:16px;gap:8px}
  .composer textarea{min-height:72px}
  .send{width:40px;height:40px;border-radius:12px}
  .chip{min-height:34px;padding:0 12px;font-size:13px}
  .btn{min-height:42px}
  .in{min-height:42px}
  .hero h1{font-size:clamp(24px,7.5vw,30px)}
  .page h1{font-size:24px}
}

/* ---------- attached files ---------- */
.atts{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.att{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 4px 3px 10px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface-2);font-size:13px;color:var(--fg-2)}
.att .att-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(40vw,220px);color:var(--fg)}
.att-x{display:inline-grid;place-items:center;width:24px;height:24px;border:0;border-radius:50%;background:none;color:var(--fg-2);cursor:pointer}
.att-x:hover{background:var(--line)}
.ibtn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- dashboard, pricing, share ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{display:flex;align-items:center;gap:14px;padding:16px}
.stat-v{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.plan{display:grid;gap:12px;align-content:start}
.plan-p{font-family:var(--font-display);font-size:38px;font-weight:600;line-height:1}
.plan-l{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--fg-2)}
.shared{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg)}
.shared-top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.shared-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shared-note{padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.shared-stage{flex:1;min-height:0;overflow:auto;background:var(--bg-soft);padding:16px}
.shared-stage .frame{min-height:calc(100vh - 150px)}
@media (max-width:520px){ .stat-v{font-size:24px} .shared-stage{padding:8px} }

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* ---------- Brahvia loader (replaces the three dots) ---------- */
.bload{display:inline-flex;align-items:center;gap:12px;color:var(--fg-2);font-size:14px;max-width:100%}
.bload-orb{--s:22px;position:relative;display:grid;place-items:center;width:calc(var(--s)*1.9);height:calc(var(--s)*1.9);flex:none}
.bload-orb .lg-m{height:var(--s);animation:bload-pulse 1.6s ease-in-out infinite}
.bload-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40%,var(--gold) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:bload-spin 1.1s linear infinite}
.bload-t{color:var(--fg-2);background:linear-gradient(90deg,var(--fg-2) 35%,var(--gold) 50%,var(--fg-2) 65%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:bload-shine 2s linear infinite;overflow-wrap:anywhere}
.bload-big{font-size:16px}.bload-big .bload-orb{--s:40px}
@keyframes bload-spin{to{transform:rotate(360deg)}}
@keyframes bload-pulse{50%{transform:scale(1.1);opacity:.78}}
@keyframes bload-shine{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.bload-ring,.bload-orb .lg-m,.bload-t{animation:none}.bload-t{-webkit-text-fill-color:currentColor;background:none}}
.boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;padding:32px 20px;text-align:center}
.boot h1{font-family:var(--font-display);font-size:clamp(24px,6vw,34px);margin:0}
.boot p{max-width:46ch;color:var(--fg-2);margin:0}
.boot nav{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:14px}
.legal{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.legal a,.boot nav a{color:var(--fg-2);text-decoration:underline;text-underline-offset:3px}
.pub-done{border-color:var(--ok,#1B7F4B);color:var(--ok,#1B7F4B)}
.pub-done svg{color:currentColor}

.vbtns{display:inline-flex;align-items:center;gap:2px}
.vchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 8px;font:600 11.5px/1.6 var(--font-sans,inherit);cursor:pointer}
.vchip:hover{color:var(--text)}
.mic-on{color:#fff!important;background:var(--bad,#d33)!important;animation:micpulse 1.2s ease-in-out infinite}
.vol-on{color:var(--brand,#2447d8)}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(220,50,50,.45)}50%{box-shadow:0 0 0 8px rgba(220,50,50,0)}}
@media (prefers-reduced-motion:reduce){.mic-on{animation:none}}
.cmp-row .row,.bl-in .row{flex-wrap:wrap}

.adm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.adm-tile{display:grid;gap:4px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.adm-tile strong{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.adm-tile .faint{font-size:12.5px}
.adm-bars{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:130px}

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
/* Brahvia <-> Supabase connection (js/supabase-api.js)
   Fills window.BRAHVIA_API so api.js and app.js work with real data.
   It only turns on when config.js has your Supabase URL and anon key, otherwise the app
   keeps showing "Backend not connected". The anon key is meant to be public. The service
   key and the Gemini key must NEVER appear in this folder. */
(function () {
  'use strict';
  const cfg = window.BRAHVIA_CONFIG || {};
  const env = cfg.publicEnv || {};
  if (!env.supabaseUrl || !env.supabaseAnonKey || !window.supabase || !window.supabase.createClient) return;

  const sb = window.supabase.createClient(env.supabaseUrl, env.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  const FN = env.supabaseUrl.replace(/\/$/, '') + '/functions/v1/' + (env.functionName || 'brahvia-api');
  const E = (code, message, extra) => new window.BrahviaApiError(code, message, extra);

  /* ---- error translation ---- */
  function fromDb(error) {
    const msg = String((error && error.message) || error || '');
    for (const code of ['insufficient_credits', 'rate_limited', 'daily_publish_limit', 'publish_limit', 'not_found', 'invalid_input', 'unauthorized']) if (msg.includes(code)) return E(code, msg);
    if (error && (error.status === 401 || error.code === 'PGRST301' || /jwt/i.test(msg))) return E('unauthorized', msg);
    return E('server', 'Something went wrong. Try again.');
  }
  function fromAuth(error) {
    const msg = String((error && error.message) || '');
    if (/invalid login credentials/i.test(msg)) return E('unauthorized', msg);
    if (/email not confirmed/i.test(msg)) return E('invalid_input', 'Confirm your email first. Check your inbox for the link.');
    if (/already registered|already been registered/i.test(msg)) return E('invalid_input', 'That email already has an account. Sign in instead.');
    if (/password/i.test(msg) && /(least|weak|short|characters)/i.test(msg)) return E('invalid_input', msg);
    if (error && error.status === 429) return E('rate_limited', 'Too many attempts. Wait a few minutes and try again.');
    return E('server', msg || 'Sign-in failed. Try again.');
  }
  const must = ({ data, error }) => { if (error) throw fromDb(error); return data; };

  async function accessToken() {
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) throw E('unauthorized', 'You are signed out or your sign-in expired. Sign in again.');
    return data.session.access_token;
  }

  /* ---- calls the Edge Function. For streaming routes, reads server-sent events. ---- */
  async function callFn(route, body, signal, onEvent) {
    const token = await accessToken();
    let res;
    try {
      res = await fetch(FN + '/' + route, {
        method: 'POST', signal,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, apikey: env.supabaseAnonKey },
        body: JSON.stringify(body || {})
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw E('cancelled', 'Stopped.');
      throw E('server', 'Could not reach the server. Check your connection.');
    }
    if (!res.ok) {
      const j = await res.json().catch(() => null);
      const er = (j && j.error) || {};
      throw E(er.code || 'server', er.message || 'Something went wrong. Try again.');
    }
    if (!onEvent) return res.json();
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = ''; let done = null;
    try {
      for (;;) {
        const { value, done: end } = await reader.read();
        if (end) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) !== -1) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          if (!block.startsWith('data: ')) continue;
          let ev; try { ev = JSON.parse(block.slice(6)); } catch (x) { continue; }
          if (ev.type === 'error') throw E(ev.code || 'server', ev.message || 'The request failed.');
          if (ev.type === 'done') done = ev;
          onEvent(ev);
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') throw E('cancelled', 'Stopped.');
      throw e;
    }
    if (!done) throw E('server', 'The connection ended before the answer was finished. You were not charged unless it was saved.');
    return done;
  }

  const rows = (q) => q.then(must);
  async function sessionFromUser(user) {
    if (!user) return null;
    let name = (user.user_metadata && user.user_metadata.name) || '';
    const r = await sb.from('profiles').select('display_name').eq('id', user.id).maybeSingle();
    if (r.data && r.data.display_name) name = r.data.display_name;
    return { user: { id: user.id, email: user.email, name: name || (user.email || '').split('@')[0] } };
  }

  async function projectDetail(id) {
    const p = await sb.from('projects').select('id,title,kind,updated_at,current_version_id').eq('id', id).maybeSingle().then(must);
    if (!p) throw E('not_found', 'That project no longer exists.');
    const [versions, messages, cur] = await Promise.all([
      sb.from('project_versions').select('id,number,created_at,prompt').eq('project_id', id).order('number', { ascending: true }).then(must),
      sb.from('project_messages').select('id,role,text,created_at').eq('project_id', id).order('created_at', { ascending: true }).then(must),
      p.current_version_id ? sb.from('project_versions').select('files').eq('id', p.current_version_id).maybeSingle().then(must) : Promise.resolve(null)
    ]);
    return {
      id: p.id, title: p.title, kind: p.kind, updatedAt: p.updated_at, versionCount: versions.length, currentVersionId: p.current_version_id,
      files: (cur && cur.files) || {},
      versions: versions.map((v) => ({ id: v.id, number: v.number, createdAt: v.created_at, prompt: v.prompt })),
      messages: messages.map((m) => ({ id: m.id, role: m.role, text: m.text, createdAt: m.created_at }))
    };
  }

  /* recovery link from the password-reset email: tell the app to show "set a new password" */
  sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') window.dispatchEvent(new CustomEvent('brahvia:recovery')); });

  window.BRAHVIA_API = {
    status: async () => {
      const out = { auth: true, database: false, ai: false, shares: false };
      try { const r = await sb.from('app_config').select('key').limit(1); out.database = !r.error && Array.isArray(r.data) && r.data.length > 0; } catch (e) {}
      try { const r = await sb.from('project_shares').select('id').limit(1); out.shares = !r.error; } catch (e) {}
      try { const r = await callFn('status', {}); out.ai = r.ai === true; } catch (e) {}
      return out;
    },
    auth: {
      googleEnabled: env.googleEnabled === true,
      getSession: async () => { const { data } = await sb.auth.getSession(); return sessionFromUser(data && data.session && data.session.user); },
      signIn: async ({ email, password }) => { const { data, error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw fromAuth(error); return sessionFromUser(data.user); },
      signUp: async ({ name, email, password }) => {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw fromAuth(error);
        if (!data.session) return { needsEmailConfirmation: true };
        return sessionFromUser(data.user);
      },
      signInWithGoogle: async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }); if (error) throw fromAuth(error); },
      resetPassword: async ({ email }) => { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) throw fromAuth(error); },
      updatePassword: async ({ password }) => { const { error } = await sb.auth.updateUser({ password }); if (error) throw fromAuth(error); },
      signOut: async () => { const { error } = await sb.auth.signOut({ scope: 'local' }); if (error) throw fromAuth(error); }
    },
    profile: {
      update: async ({ name }) => {
        const { data } = await sb.auth.getUser(); const uid = data && data.user && data.user.id;
        if (!uid) throw E('unauthorized', 'You are signed out or your sign-in expired. Sign in again.');
        await sb.from('profiles').update({ display_name: name }).eq('id', uid).then(must);
        await sb.auth.updateUser({ data: { name } });
        return sessionFromUser(data.user);
      }
    },
    credits: {
      get: async () => {
        try { await sb.rpc('claim_daily_credits'); } catch (e) { /* older database: no daily credits yet */ }
        const [acct, conf] = await Promise.all([sb.from('credit_accounts').select('balance').maybeSingle().then(must), sb.from('app_config').select('value').eq('key', 'credits').maybeSingle().then(must)]);
        if (!acct || !conf) throw E('not_found', 'Credit information is not available yet.');
        return { balance: acct.balance, starter: conf.value.starter, daily: conf.value.daily || 0, lowAt: conf.value.lowAt, costs: conf.value.costs };
      },
      usage: async ({ limit } = {}) => {
        const r = await sb.from('credit_ledger').select('id,created_at,label,kind,amount,balance_after').order('id', { ascending: false }).limit(limit || 50).then(must);
        return r.map((u) => ({ id: u.id, createdAt: u.created_at, label: u.label, kind: u.kind, amount: u.amount, balanceAfter: u.balance_after }));
      }
    },
    projects: {
      list: async () => {
        const r = await sb.from('projects').select('id,title,kind,updated_at').order('updated_at', { ascending: false }).then(must);
        return r.map((p) => ({ id: p.id, title: p.title, kind: p.kind, updatedAt: p.updated_at }));
      },
      get: projectDetail,
      remove: async (id) => { await sb.from('projects').delete().eq('id', id).then(must); },
      generate: async ({ projectId, kind, prompt, attachments, signal, onEvent }) => {
        const done = await callFn('generate', { projectId: projectId || null, kind, prompt, attachments: attachments || [] }, signal, onEvent || (() => {}));
        return projectDetail(done.projectId);
      },
      saveVersion: async (id, files) => { await sb.rpc('save_version', { p_project: id, p_files: files, p_prompt: 'Manual edit' }).then(must); return projectDetail(id); },
      getVersion: async (id, versionId) => {
        const v = await sb.from('project_versions').select('files').eq('id', versionId).eq('project_id', id).maybeSingle().then(must);
        if (!v) throw E('not_found', 'That version no longer exists.');
        return { files: v.files };
      },
      restoreVersion: async (id, versionId) => { await sb.rpc('restore_version', { p_project: id, p_version: versionId }).then(must); return projectDetail(id); }
    },
    chats: {
      list: async () => {
        const r = await sb.from('chats').select('id,title,mode,updated_at').order('updated_at', { ascending: false }).then(must);
        return r.map((c) => ({ id: c.id, title: c.title, mode: c.mode, updatedAt: c.updated_at }));
      },
      get: async (id) => {
        const c = await sb.from('chats').select('id,title,mode,updated_at').eq('id', id).maybeSingle().then(must);
        if (!c) throw E('not_found', 'That chat no longer exists.');
        const m = await sb.from('chat_messages').select('id,role,text,created_at').eq('chat_id', id).order('created_at', { ascending: true }).then(must);
        return { id: c.id, title: c.title, mode: c.mode, updatedAt: c.updated_at, messages: m.map((x) => ({ id: x.id, role: x.role, text: x.text, createdAt: x.created_at })) };
      },
      send: async ({ chatId, mode, text, attachments, signal, onDelta }) => {
        const done = await callFn('chat', { chatId: chatId || null, mode, text, attachments: attachments || [] }, signal, (ev) => { if (ev.type === 'delta' && onDelta) onDelta(ev.text); });
        return { chatId: done.chatId };
      },
      remove: async (id) => { await sb.from('chats').delete().eq('id', id).then(must); }
    },
    memory: {
      list: async () => {
        const [prof, rows] = await Promise.all([sb.from('profiles').select('memory_on').maybeSingle().then(must), sb.from('user_memories').select('id,note,created_at').order('id', { ascending: false }).then(must)]);
        return { enabled: !prof || prof.memory_on !== false, notes: (rows || []).map((r) => ({ id: r.id, note: r.note, createdAt: r.created_at })) };
      },
      setEnabled: async (on) => { await sb.rpc('set_memory', { p_on: !!on }).then(must); },
      remove: async (id) => { await sb.from('user_memories').delete().eq('id', id).then(must); },
      clear: async () => { await sb.from('user_memories').delete().gte('id', 0).then(must); }
    },
    shares: {
      status: async (projectId) => {
        const r = await sb.from('project_shares').select('token,version_id,created_at').eq('project_id', projectId).is('revoked_at', null).maybeSingle().then(must);
        return r ? { token: r.token, versionId: r.version_id, createdAt: r.created_at } : null;
      },
      create: async (projectId) => sb.rpc('create_share', { p_project: projectId }).then(must),
      revoke: async (projectId) => { await sb.rpc('revoke_share', { p_project: projectId }).then(must); },
      getPublic: async (token) => {
        const { data, error } = await sb.rpc('get_shared', { p_token: token });
        if (error) throw fromDb(error);
        return { title: data.title, kind: data.kind, files: data.files, sharedAt: data.sharedAt };
      }
    },
    github: {
      status: async () => callFn('github-status', {}),
      start: async () => (await callFn('github-start', { redirectUri: location.origin + location.pathname })).url,
      connect: async ({ code, state }) => callFn('github-connect', { code, state, redirectUri: location.origin + location.pathname }),
      disconnect: async () => { await callFn('github-disconnect', {}); },
      publish: async ({ projectId, repo, useExisting }) => callFn('github-publish', { projectId, repo, useExisting: useExisting === true }),
      quota: async () => {
        const [prof, conf] = await Promise.all([sb.from('profiles').select('plan,publishes_used').maybeSingle().then(must), sb.from('app_config').select('value').eq('key', 'limits').maybeSingle().then(must)]);
        return { used: prof ? prof.publishes_used || 0 : 0, limit: (conf && conf.value && conf.value.freePublishes) || 5, plan: prof && prof.plan === 'paid' ? 'paid' : 'free' };
      },
      publishes: async (projectId) => {
        const r = await sb.from('project_publishes').select('repo,url,published_at').eq('project_id', projectId).eq('provider', 'github').maybeSingle().then(must);
        return r ? { repo: r.repo, url: r.url, publishedAt: r.published_at } : null;
      }
    },
    voice: {
      transcribe: async ({ mime, data }) => callFn('transcribe', { mime, data })
    },
    jobs: {
      cancel: async (jobId) => { await callFn('job-cancel', { jobId }); },
      recent: async () => {
        const since = new Date(Date.now() - 6 * 60 * 1000).toISOString();
        const r = await sb.from('generation_jobs').select('id,kind,status,created_at').gte('created_at', since).order('created_at', { ascending: false }).limit(10).then(must);
        return (r || []).map((j) => ({ id: j.id, kind: j.kind, status: j.status, createdAt: j.created_at }));
      }
    },
    pay: {
      plans: async () => callFn('plans', {}),
      createOrder: async (sku) => callFn('pay-create', { sku }),
      verify: async ({ orderId, paymentId, signature }) => callFn('pay-verify', { orderId, paymentId, signature })
    },
    billing: {
      get: async () => {
        const r = await sb.from('profiles').select('plan,plan_name,plan_until').maybeSingle().then(must);
        const active = !!r && r.plan === 'paid' && (!r.plan_until || new Date(r.plan_until) > new Date());
        return { active, name: r && r.plan_name ? r.plan_name : null, until: r && r.plan_until ? r.plan_until : null };
      }
    },
    keys: {
      status: async () => callFn('keys-status', {}),
      save: async ({ provider, key, model, baseUrl }) => callFn('key-save', { provider, key, model: model || undefined, baseUrl: baseUrl || undefined }),
      use: async (provider) => callFn('key-use', { provider: provider || null }),
      remove: async (provider) => callFn('key-delete', { provider })
    },
    admin: {
      summary: async () => callFn('admin-summary', {})
    },
    hosts: {
      status: async () => callFn('hosts-status', {}),
      connect: async ({ provider, token }) => callFn('host-connect', { provider, token }),
      disconnect: async (provider) => { await callFn('host-disconnect', { provider }); },
      publish: async ({ provider, projectId, name }) => callFn('host-publish', { provider, projectId, name }),
      domainAdd: async ({ provider, projectId, domain }) => callFn('domain-add', { provider, projectId, domain }),
      domainStatus: async ({ provider, projectId }) => callFn('domain-status', { provider, projectId }),
      domainRemove: async ({ provider, projectId }) => callFn('domain-remove', { provider, projectId }),
      publishes: async (projectId) => {
        const r = await sb.from('project_publishes').select('provider,repo,url,domain').eq('project_id', projectId).in('provider', ['netlify', 'vercel']).then(must);
        return (r || []).map((x) => ({ provider: x.provider, name: x.repo, url: x.url, domain: x.domain || null }));
      }
    },
    account: {
      exportData: async () => sb.rpc('export_my_data').then(must),
      deleteAccount: async () => { await callFn('account-delete', { confirm: 'DELETE' }); try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {} }
    }
  };
})();

</script>
  <script>
/* ============================================================================
   Brahvia API adapter  (js/api.js)

   THE ONLY FILE you edit to connect a backend.
   The screens in app.js call these functions and nothing else. Out of the box every
   function rejects with ApiError('not_connected'), and the screens show an honest
   "backend not connected" state. There is no fake data anywhere in the frontend.

   How to connect:
     1. Replace the body of each function below with a real call (Supabase, your own
        server routes, etc.). Keep the argument and return shapes shown in the comments.
     2. Throw ApiError with one of these codes so the screens can explain what went wrong:
          not_connected | unauthorized | insufficient_credits | rate_limited |
          invalid_input | not_found | cancelled | server
     3. Set window.BRAHVIA_API = { ...yourFunctions } before app.js loads, or edit this
        file directly. Missing functions fall back to the "not connected" version.

   SECURITY RULES (important for the real backend):
     - The AI key (for example GEMINI_API_KEY) lives only on your server. Never here.
     - Credit balance and credit spending are decided only on your server, in a database
       transaction. The balance shown here is display-only.
     - Every project, chat and file read must be limited to the signed-in owner (RLS).
   ============================================================================ */
(function () {
  'use strict';

  class ApiError extends Error {
    constructor(code, message, extra) {
      super(message || code);
      this.name = 'ApiError';
      this.code = code;
      Object.assign(this, extra || {});
    }
  }

  const nc = (what) => () =>
    Promise.reject(new ApiError('not_connected', 'Backend not connected yet (' + what + '). Implement it in js/api.js.'));

  /* ---- Shapes the screens expect --------------------------------------------
     Session   { user: { id, email, name, avatarUrl? } } | null
     Credits   { balance:number, starter:number, daily:number, lowAt:number,
                 costs:{ chat, code, website, webapp, edit } }          (costs in credits)
     UsageRow  { id, createdAt:ISO, label, kind, amount:number, balanceAfter:number }
     Project   { id, title, kind:'website'|'webapp', updatedAt:ISO, versionCount:number }
     ProjectDetail Project & {
                 files:{ [path]:string },                 e.g. index.html, styles.css, script.js
                 versions:[{ id, number, createdAt:ISO, prompt }], currentVersionId,
                 messages:[{ id, role:'user'|'assistant', text, createdAt:ISO }] }
     Chat      { id, title, mode:'chat'|'code', updatedAt:ISO }
     ChatDetail Chat & { messages:[{ id, role, text, createdAt:ISO }] }
     Attachment { name, mime, kind:'text'|'inline', data }   (max 3 per message)
                 kind 'text'   -> data is the file text (text/code files, up to 100 KB each)
                 kind 'inline' -> data is base64 of image/png|jpeg|webp or application/pdf (the screen shrinks
                                  photos to JPEG first). Files are NOT stored; only their names go into the chat text.
                 The server checks type, size and file signature again. Never trust the browser's checks.
  ---------------------------------------------------------------------------- */

  const defaults = {
    /* Tells the Settings screen what is connected. Return true for each part you finished. */
    status: () => Promise.resolve({ auth: false, database: false, ai: false, shares: false }),

    auth: {
      getSession: nc('auth.getSession'),              // -> Session | null
      signIn: nc('auth.signIn'),                      // ({ email, password }) -> Session

function renderText(t) {
  const parts = String(t || '').split(/```/);
  return parts.map((p, i) => {
    if (i % 2 === 0) return p ? `<div style="white-space:pre-wrap">${esc(p)}</div>` : '';
    const nl = p.indexOf('\n'); const lang = nl > -1 ? p.slice(0, nl).trim() : ''; const code = nl > -1 ? p.slice(nl + 1) : p;

  }).join('');

/* ---------- preview: sandboxed iframe, scripts allowed, no network, no top navigation ---------- */
function buildSrcdoc(files, strict) {
  let html = files['index.html'] || ''; if (!html) return '';
  html = html.replace(/<link[^>]+href=["']([^"']+\.css)["'][^>]*>/gi, (m, h) => (files[h] != null ? '<style>' + String(files[h]).replace(/<\/style/gi, '<\\/style') + '</style>' : m));
  html = html.replace(/<script[^>]+src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi, (m, h) => (files[h] != null ? '<script>' + String(files[h]).replace(/<\/script/gi, '<\\/script') + '<\/script>' : m));
  const csp = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: blob:; style-src \'unsafe-inline\'; font-src data:; script-src \'unsafe-inline\'; form-action \'none\'">';
  const guard = '<script>document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(!a)return;e.preventDefault();var h=a.getAttribute("href")||"";if(h.charAt(0)==="#"&&h.length>1){var t=null;try{t=document.getElementById(decodeURIComponent(h.slice(1)))}catch(x){}if(t)t.scrollIntoView({behavior:"smooth"})}else if(h==="#"){window.scrollTo(0,0)}},true);document.addEventListener("submit",function(e){e.preventDefault()},true);<\/script>';
  const head = csp + guard;
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + head) : head + html;
}

  if (e.target.dataset.change === 'attach') { const fl = e.target.files; addAttachments(fl); try { e.target.value = ''; } catch (x) {} return; }
  if (e.target.dataset.change === 'keyprov') { UI.keyProv = e.target.value; UI.keyMsg = ''; UI.keyConfirm = ''; render(); return; }
  if (e.target.dataset.change === 'vvoice') { const l = e.target.dataset.l === 'hi' ? 'hi' : 'en'; P.vvoices = Object.assign({}, P.vvoices, { [l]: e.target.value || '' }); savePrefs(); testVoice(l); return; }

function pollJobs() {
  clearTimeout(BG_TIMER); BG_TIMER = 0;
  if (!(R.session.s === 'ready' && R.session.v && R.session.v.user) || UI.share) return;
  if (UI.gen && UI.gen.running) { BG_TIMER = setTimeout(pollJobs, 4000); return; }
  Promise.resolve(api.jobs.recent()).then((rows) => {
    const now = (rows || []).filter((j) => (j.kind === 'website' || j.kind === 'webapp'));
    const running = now.filter((j) => j.status === 'running');
    const before = UI.bg || [];
    UI.bg = running;
    before.filter((b) => !running.some((r) => r.id === b.id)).forEach((b) => {
      const j = now.find((x) => x.id === b.id);
      if (j && j.status === 'succeeded') {
        toast('Your project is ready. Open Projects.'); refreshLists();
        if (UI.view === 'builder' && UI.projectId && !UI.dirty && !(UI.gen && UI.gen.running)) api.projects.get(UI.projectId).then((pr) => { if (!UI.dirty) { setProject(pr); render(); } }, () => {});
      } else toast('The build did not finish. Your credits were given back.');
      refreshCredits();
    });
    if (before.length !== running.length || before.some((b, i) => !running[i] || running[i].id !== b.id)) render();
    if (running.length) BG_TIMER = setTimeout(pollJobs, 4000);
  }, () => { BG_TIMER = setTimeout(pollJobs, 8000); });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pollJobs(); });
window.addEventListener('brahvia:recovery', () => { UI.recovery = true; render(); });
window.addEventListener('hashchange', () => render());
load('session', api.auth.getSession);
render();
Promise.resolve(api.auth.getSession()).then(() => setTimeout(pollJobs, 500), () => {});
})();

</script>
</body>
